<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="description" content="Sign in to your private Smart Pantry." />
    <title>Sign in — Smart Pantry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <a class="brand auth-brand" href="./login.html" aria-label="Pantry home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M7 11h18v15H7zM10 11V7h12v4M12 16v6m8-6v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 4c1.4 1.2 2.2 2.5 2.2 4M20 4c-1.4 1.2-2.2 2.5-2.2 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">pantry<span>.</span></span>
      </a>
      <section class="auth-card" aria-labelledby="auth-title">
        <span class="auth-illustration" aria-hidden="true">✳</span>
        <p class="eyebrow">YOUR PANTRY, YOUR SPACE</p>
        <h1 id="auth-title">Welcome back</h1>
        <p class="auth-intro">Sign in to pick up where you left off.</p>
        <p class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></p>
        <form id="auth-form" data-auth-mode="login">
          <label class="field-label" for="auth-email">Email address</label>
          <input id="auth-email" name="email" type="email" autocomplete="email" maxlength="254" required />
          <label class="field-label auth-password-label" for="auth-password">Password</label>
          <div class="password-field">
            <input id="auth-password" name="password" type="password" autocomplete="current-password" required />
            <button class="password-toggle" id="password-toggle" type="button" aria-controls="auth-password"
                    aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <button class="button button-primary auth-submit" id="auth-submit" type="submit">Sign in</button>
        </form>
        <p class="auth-switch">New to Pantry? <a href="./register.html">Create an account</a></p>
      </section>
      <p class="auth-footer">A calmer way to keep track of your pantry.</p>
    </main>
    <script src="./config.js"></script>
    <script type="module" src="./auth.js"></script>
  </body>
</html>
